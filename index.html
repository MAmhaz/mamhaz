<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<title>الراديو الإسلامي</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8e44ad">
<link rel="manifest" href="manifest.json">
<style>
:root{--p:#8e44ad;--s:#3498db;--lb:#f8f9fa;--lt:#2c3e50;--db:#121212;--dc:#1e1e1e;--dt:#e6e6e6;--er:#e74c3c;--bf:#f39c12}
*{box-sizing:border-box}
body{touch-action:pan-y;user-select:none;-webkit-user-select:none;text-align:center;background:var(--lb);color:var(--lt);margin:0;padding:0 0 10vh;font-family:'Segoe UI',Tahoma,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.dark-mode{background:var(--db);color:var(--dt)}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--p);color:#fff;padding:1vh;font-size:2vh;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.dark-mode .top-bar{background:var(--dc);color:var(--s)}
#app{width:88vw;max-width:800px;margin:8vh auto 2rem;padding:1vh;background:#fff;border-radius:2vh;box-shadow:0 1vh 2.5vh rgba(0,0,0,.1);transition:all .5s}
.dark-mode #app{background:var(--dc)}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:2vh;gap:1vh}
.tab,.rbtn,.lbtn,.tbtn{padding:1vh 2vh;border-radius:.8vh;border:none;background:linear-gradient(135deg,#f5f7fa,#e4e8eb);cursor:pointer;font-weight:bold;transition:all .3s;color:var(--p);min-width:35vh}
.dark-mode .tab,.dark-mode .rbtn,.dark-mode .lbtn,.dark-mode .tbtn{background:linear-gradient(135deg,#2a2a3a,#1e1e2e);color:var(--s)}
.tab.active,.rbtn.active,.lbtn.active{background:var(--p);color:#fff}
.dark-mode .tab.active,.dark-mode .rbtn.active,.dark-mode .lbtn.active{background:var(--s)}
.sc{max-height:35vh;overflow-y:auto;margin:1rem 0;scrollbar-width:thin;padding:0 5px;mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 90%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 90%,transparent 100%)}
.sc::-webkit-scrollbar{width:10px}
.sc::-webkit-scrollbar-thumb{background:var(--p);border-radius:5px}
.dark-mode .sc::-webkit-scrollbar-thumb{background:var(--s)}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:.6vh;margin:1vh 0}
.card{padding:.5vh .8vh;border-radius:1.2vh;background:linear-gradient(135deg,#f5f7fa,#e4e8eb);cursor:pointer;color:var(--p);transition:all .3s;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:4vh;flex:0 0 calc(100% - 1.2vh);max-width:600px}
.card div{font-size:1.8vh;font-weight:bold}
.dark-mode .card{background:linear-gradient(135deg,#2a2a3a,#1e1e2e);color:var(--s)}
.card:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 10px 20px rgba(0,0,0,.15)}
.card.active{background:linear-gradient(135deg,var(--p),#9b59b6);color:#fff;box-shadow:0 .5vh 1.5vh rgba(94,53,177,.4)}
.dark-mode .card.active{background:linear-gradient(135deg,var(--s),#2980b9);box-shadow:0 .5vh 1.5vh rgba(255,214,0,.4)}
.icn{font-size:2.5vh;margin-bottom:.5vh}
.ctrl{margin:2.5vh 0;display:flex;flex-direction:column;align-items:center;gap:1.5vh}
.pbtn,.sbtn,.nbtn{background:linear-gradient(135deg,var(--p),#9b59b6);color:#fff;border:none;cursor:pointer;transition:all .3s;box-shadow:0 .5vh 1.5vh rgba(94,53,177,.4);display:inline-flex;align-items:center;justify-content:center}
.pbtn{padding:1.2vh 3vh;border-radius:5vh;font-size:1.8vh;gap:.8vh;min-width:12vh}
.dark-mode .pbtn,.dark-mode .sbtn,.dark-mode .nbtn{background:linear-gradient(135deg,var(--s),#2980b9);box-shadow:0 .5vh 1.5vh rgba(255,214,0,.4)}
.pbtn.playing{animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.viz{width:100%;height:6vh;margin:1.5vh 0;display:flex;justify-content:center;align-items:center;gap:.4vh}
.vbar{width:1vh;height:1.5vh;background:var(--p);border-radius:.3vh;transition:height .1s}
.dark-mode .vbar{background:var(--s)}
.skc,.ed{display:none}.skc.on{display:block}
#sk,#vs{width:95%;height:.6vh;border-radius:.3vh;background:#ddd;-webkit-appearance:none;transition:all .3s}
.dark-mode #sk,.dark-mode #vs{background:#444}
#sk::-webkit-slider-thumb,#vs::-webkit-slider-thumb{width:1.8vh;height:1.8vh;border-radius:50%;background:var(--p);-webkit-appearance:none;cursor:pointer}
.dark-mode #sk::-webkit-slider-thumb,.dark-mode #vs::-webkit-slider-thumb{background:var(--s)}
.td{display:flex;justify-content:space-between;margin-top:.5vh;font-size:1.4vh;color:var(--p)}
.dark-mode .td{color:var(--s)}
.psc{width:100%;margin:2vh 0;display:none;flex-direction:row;justify-content:center;align-items:center;gap:2vh}
.psc.on{display:flex}
.sbtn,.nbtn{width:4vh;height:4vh;border-radius:50%;font-weight:bold}
.sl,.nv{font-size:1.6vh;font-weight:bold;color:var(--p)}
.dark-mode .sl,.dark-mode .nv{color:var(--s)}
.vc{margin:2vh 0;width:100%}
.vctr{display:flex;align-items:center;justify-content:center;gap:1.5vh;margin-top:1.5vh}
.vi{font-size:2vh;cursor:pointer;color:var(--p)}.dark-mode .vi{color:var(--s)}
.st{margin:1.5vh 0;font-size:1.6vh;min-height:2vh;color:var(--p);font-weight:500}.dark-mode .st{color:var(--s)}.st.bf{color:var(--bf)}.st.er{color:var(--er)}
.ft,.bn{position:fixed;left:0;right:0;background:#fff;z-index:1000;padding:1vh 0;text-align:center;font-size:1.5vh;font-weight:bold}
.ft{bottom:0;border-top:1px solid #ddd}
.bn{bottom:3.8vh;display:flex;justify-content:space-around;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
.dark-mode .ft,.dark-mode .bn{background:var(--dc);border-top:1px solid #444}
.ft a{color:var(--p);text-decoration:none}.dark-mode .ft a{color:var(--s)}
.nb{display:flex;flex-direction:column;align-items:center;background:none;border:none;color:var(--p);font-size:1.5vh;cursor:pointer;padding:.5vh 1vh;border-radius:1vh;transition:all .3s}
.dark-mode .nb{color:var(--s)}.ni{font-size:3vh;margin-bottom:.5vh}.nt{font-size:1.6vh}
.menu{position:fixed;left:50%;bottom:12vh;width:32vh;padding:1vh;background:rgba(255,255,255,.95);border-radius:2vh;display:none;flex-direction:column;align-items:center;box-shadow:0 1vh 3vh rgba(0,0,0,.2);transform:translateX(-50%);z-index:998}
.dark-mode .menu{background:rgba(30,30,46,.95)}.menu.on{display:flex}
.lbtn{width:80%;margin:.5vh 0;text-align:center;min-width:auto}
.cls{position:absolute;top:1vh;right:1vh;font-size:1.5vh;cursor:pointer;color:#7f8c8d}
.bfi{display:none;width:2vh;height:2vh;border:.3vh solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s linear infinite;margin-left:1vh}
@keyframes spin{to{transform:rotate(360deg)}}
.tmc{width:100%;display:flex;flex-direction:column;align-items:center;margin-bottom:2vh}
.nic{display:flex;align-items:center;justify-content:center;gap:1.5vh;margin:1vh 0}
.nv{font-size:2.5vh;min-width:5vh;text-align:center}
.til{font-size:1.8vh;margin-bottom:1vh}
.ta{display:flex;gap:1.5vh;width:100%;justify-content:center}
.tbtn{min-width:auto;width:auto}
.tds{margin-top:1.5vh;font-size:1.5vh;color:var(--p);font-weight:bold;text-align:center}
.dark-mode .tds{color:var(--s)}
.cc{position:fixed;bottom:10vh;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:997}
.tcd,.tsm{font-size:1.8vh;font-weight:bold;padding:1vh;border-radius:1vh;margin-bottom:1.5vh;display:none;min-width:25vh;text-align:center}
.tcd{color:var(--p);background:rgba(255,255,255,.9);box-shadow:0 .5vh 1.5vh rgba(0,0,0,.15)}
.dark-mode .tcd{color:var(--s);background:rgba(30,30,46,.9)}
.tsm{color:#fff;background:var(--er);animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(1vh)}to{opacity:1;transform:translateY(0)}}
.oi{position:fixed;bottom:12vh;left:50%;transform:translateX(-50%);background:var(--er);color:#fff;padding:.8vh 2vh;border-radius:2vh;font-size:1.5vh;z-index:1000;display:none;animation:fio 2s infinite}
@keyframes fio{0%,100%{opacity:.5}50%{opacity:1}}
.ccc{display:none}.ccc.on{display:block}
.rc{width:100%;text-align:center;margin-bottom:2vh;padding:1vh;border-radius:1vh;background:linear-gradient(135deg,#f5f7fa,#e4e8eb)}
.dark-mode .rc{background:linear-gradient(135deg,#2a2a3a,#1e1e2e)}
.rl{font-size:1.5vh;font-weight:bold;margin-bottom:1vh;color:var(--p)}.dark-mode .rl{color:var(--s)}
.rbs{display:flex;justify-content:center;gap:2vh;flex-wrap:wrap}
.rbtn{min-width:15vh;box-shadow:0 .2vh .5vh rgba(0,0,0,.1)}
.sh{text-align:center;font-size:2.5vh;font-weight:bold;color:var(--p);animation:bounce 2s infinite}
.dark-mode .sh{color:var(--s)}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}60%{transform:translateY(-3px)}}
@media(max-width:768px){.nt{font-size:1.4vh;font-weight:bold;opacity:.9}.ni{font-size:2.8vh;margin-bottom:.3vh}}
@media(max-width:480px){.nt{font-size:1.1vh;font-weight:bold}.ni{font-size:2.5vh}}
@media(orientation:landscape){#app{margin:8vh auto;max-height:80vh;overflow-y:auto}}
</style>
</head>
<body>

<div class="top-bar"><span data-i18n="title"></span></div>

<div id="app">
  <div class="sh">1 ⌵</div>
  <div class="tabs">
    <button class="tab active" data-cat="news" data-i18n="tab_news"></button>
    <button class="tab" data-cat="quran" data-i18n="tab_quran"></button>
    <button class="tab" data-cat="duas" data-i18n="tab_duas"></button>
  </div>
  <div class="sc"><div id="sc"></div></div>
  <div class="st" id="st" data-i18n="select_station"></div>
  <div class="viz" id="viz"></div>
  <div class="skc" id="skc">
    <input type="range" id="sk" min="0" max="100" value="0">
    <div class="td"><span id="ct">0:00</span><span id="dr">0:00</span></div>
    <div class="ed" id="edc"><span id="ed"></span></div>
  </div>
  <div class="psc" id="psc">
    <div class="sl" data-i18n="playback_speed"></div>
    <button class="sbtn" id="sb">1x</button>
  </div>
  <div class="ctrl">
    <button class="pbtn" id="pb">
      <span id="pi">▶️</span>
      <span id="pt" data-i18n="play"></span>
      <div class="bfi" id="bfi"></div>
    </button>
  </div>
  <audio id="ap" crossorigin="anonymous" preload="auto"></audio>
  <div class="vc">
    <div class="vctr">
      <span class="vi" id="vd">🔉</span>
      <input type="range" id="vs" min="0" max="1" step="0.01" value="0.75">
      <span class="vi" id="vu">🔊</span>
    </div>
  </div>
</div>

<div class="bn">
  <button class="nb" id="lbtn"><span class="ni">🌐</span><span class="nt" data-i18n="language"></span></button>
  <button class="nb" id="tbtn"><span class="ni">⏱️</span><span class="nt" data-i18n="timer"></span></button>
  <button class="nb" id="thbtn"><span class="ni">🌓</span><span class="nt" data-i18n="theme"></span></button>
  <button class="nb" id="dbtn"><span class="ni">📲</span><span class="nt" data-i18n="download"></span></button>
</div>

<div class="ft"><span data-i18n="footer_programmer"></span> <span> | </span> <span data-i18n="version"></span></div>

<div class="menu" id="lmenu"><span class="cls">✕</span><button class="lbtn" data-lang="en">English 🇬🇧</button><button class="lbtn active" data-lang="ar">العربية 🇱🇧</button></div>

<div class="menu" id="tmenu">
  <span class="cls">✕</span>
  <div class="tmc"><div class="til" data-i18n="set_sleep_timer"></div>
    <div class="nic"><button class="nbtn" id="db">-</button><div class="nv" id="tv">30</div><button class="nbtn" id="ib">+</button></div>
  </div>
  <div class="ta"><button class="tbtn" id="tsb" data-i18n="set"></button><button class="tbtn" id="tcb" data-i18n="cancel"></button></div>
  <div class="tds" id="tds"></div>
</div>

<div class="cc"><div class="tcd" id="tcd"></div><div class="tsm" id="tsm" data-i18n="timer_stopped"></div></div>
<div class="oi" id="oi" data-i18n="offline_message"></div>

    {id:'dua_kumayl',key:'dua_kumayl',halwaji:'https://shiavoice.com/media/edaie/du3a_kumail/ux6sdpqvbhwk.mp3',ghareeb:'https://shiavoice.com/media/edaie/du3a_kumail/nicqftiinv08.mp3'},
    {id:'dua_saturday',key:'dua_saturday',halwaji:'https://shiavoice.com/media/edaie/ed3ie_eiam/abathar_elhlwachi/jo65n6z2qbwc.mp3',ghareeb:'https://shiavoice.com/media/edaie/ed3ie_eiam/hussein_garib/xufstzztkx85.mp3'},
    {id:'dua_sunday',key:'dua_sunday',halwaji:'https://shiavoice.com/media/edaie/ed3ie_eiam/abathar_elhlwachi/nx8if6n13wsq.mp3',ghareeb:'https://www.shiavoice.com/media/edaie/ed3ie_eiam/hussein_garib/fgej18i0tgnq.mp3'},
    {id:'dua_monday',key:'dua_monday',halwaji:'https://shiavoice.com/media/edaie/ed3ie_eiam/abathar_elhlwachi/izwah2wx0fe6.mp3',ghareeb:'https://shiavoice.com/media/edaie/ed3ie_eiam/hussein_garib/hgcg4r9m59f7.mp3'},
    {id:'dua_tuesday',key:'dua_tuesday',halwaji:'https://shiavoice.com/media/edaie/ed3ie_eiam/abathar_elhlwachi/koc7sp2r97iz.mp3',ghareeb:'https://shiavoice.com/media/edaie/ed3ie_eiam/hussein_garib/zq5ohinq3eon.mp3'},
    {id:'dua_wednesday',key:'dua_wednesday',halwaji:'https://shiavoice.com/media/edaie/ed3ie_eiam/abathar_elhlwachi/qbrtebh4tf43.mp3',ghareeb:'https://shiavoice.com/media/edaie/ed3ie_eiam/hussein_garib/dfha7boewcmk.mp3'},
    {id:'dua_thursday',key:'dua_thursday',halwaji:'https://shiavoice.com/media/edaie/ed3ie_eiam/abathar_elhlwachi/jvws7h7gdpg1.mp3',ghareeb:'https://shiavoice.com/media/edaie/ed3ie_eiam/hussein_garib/nao3te830v6w.mp3'},
    {id:'dua_friday',key:'dua_friday',halwaji:'https://shiavoice.com/media/edaie/ed3ie_eiam/abathar_elhlwachi/oe2qbd5fzu01.mp3',ghareeb:'https://shiavoice.com/media/edaie/ed3ie_eiam/hussein_garib/huadzmzit3h3.mp3'},
    {id:'dua_thamaly',key:'dua_thamaly',halwaji:'https://shiavoice.com/media/edaie/du3a_abo_7amzeh/mczzsc6ndw29.mp3',ghareeb:'https://shiavoice.com/media/edaie/du3a_abo_7amzeh/wbhcvj6w0nvy.mp3'},
    {id:'dua_simat',key:'dua_simat',halwaji:'https://shiavoice.com/media/edaie/du3a_elsmat/jo6yozaevc2n.mp3',ghareeb:'https://shiavoice.com/media/edaie/du3a_elsmat/xb7v5tfbt71k.mp3'},
    {id:'dua_bha2',key:'dua_bha2',halwaji:'https://shiavoice.com/media/edaie/du3a_behae/ip2a9kc1niz9.mp3',ghareeb:'https://www.shiavoice.com/media/edaie/asdarat/hussein_qarib/edaie_ramadan/nxjxkio1vra6.mp3'},
    {id:'dua_yasin',key:'dua_yasin',halwaji:'https://shiavoice.com/media/zeiarat/al_yaseen/zj4kkxwtty7t.mp3',ghareeb:'https://shiavoice.com/media/zeiarat/al_yaseen/0tdt8kqml27gvrt.mp3'},
    {id:'dua_ashura',key:'dua_ashura',halwaji:'https://shiavoice.com/media/zeiarat/asdarat/ziarat1/my8upur0qjuo.mp3',ghareeb:''}
  ]
};

const G = id => document.getElementById(id);
const Q = (s, p) => (p||document).querySelector(s);
const QA = (s, p) => (p||document).querySelectorAll(s);

let L = localStorage.language || 'ar';
let playing = false, paused = false, sta = null, type = 'stream';
let speed = 1, seeking = false, reciter = 'halwaji';
let audioCtx, analyser, dataArr, animId;
let sleepTid, countInt, remain = 0, holdInt;
let cat = 'news';

function T(key, reps = {}) {
  let txt = (D[key]||{})[L] || key;
  for (const [k,v] of Object.entries(reps)) txt = txt.replace(`{${k}}`, v);
  if (key === 'footer_programmer') txt = txt.replace('{year}', new Date().getFullYear());
  return txt;
}

function setLang(lang) {
  L = lang; localStorage.language = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  QA('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (D[k]?.[lang]) el.innerHTML = T(k); });
  QA('.lbtn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  build(cat);
  const card = Q('.card.active');
  if (card && sta) G('st').textContent = T(playing ? 'status_playing' : 'status_stopped', {station: card.querySelector('[data-i18n]').textContent});
  G('lmenu').classList.remove('on');
}

function build(c) {
  cat = c; let h = '';
  if (c === 'duas') h += '<div class="sh">2 ⌵</div><div class="rc"><div class="rl" data-i18n="select_reciter">'+T('select_reciter')+'</div><div class="rbs" id="rbs"></div></div><div class="sh">3 ⌵</div>';
  else h += '<div class="sh">2 ⌵</div>';
  h += '<div class="grid">';
  (S[c]||[]).forEach(s => {
    h += `<div class="card" data-sid="${s.id}" data-url="${s.url||''}" data-key="${s.key||''}">
      <div class="icn">${s.icon||(c==='duas'?'🕌':'📻')}</div>
      <div data-i18n="${s.key||''}">${T(s.key)}</div>
    </div>`;
  });
  h += '</div>';
  G('sc').innerHTML = h;
  QA('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (D[k]?.[L]) el.innerHTML = T(k); });
  if (c === 'duas') {
    G('rbs').innerHTML = '';
    ['halwaji','ghareeb'].forEach(id => {
      const btn = document.createElement('button');
      btn.className = 'rbtn' + (reciter === id ? ' active' : '');
      btn.textContent = T('reciter_' + id);
      btn.onclick = () => { reciter = id; localStorage.currentReciter = id; build('duas'); if (type === 'audio' && sta && playing) playSta(); };
      G('rbs').appendChild(btn);
    });
  }
  QA('.card').forEach(c => c.classList.remove('active'));
  sta = null; type = 'stream';
  G('skc').classList.remove('on'); G('psc').classList.remove('on');
  G('pt').textContent = T('play'); G('st').textContent = T('select_station');
  G('sk').value = 0; G('ct').textContent = '0:00'; G('dr').textContent = '0:00'; G('edc').style.display = 'none';
  localStorage.activeCategory = c;
}

function togglePlay() {
  if (!sta) { G('st').textContent = T('select_station'); return; }
  if (playing) {
    G('ap').pause();
    if (type !== 'audio') { G('ap').currentTime = 0; paused = false; } else paused = true;
    stopViz();
  } else {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 64;
      audioCtx.createMediaElementSource(G('ap')).connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArr = new Uint8Array(analyser.frequencyBinCount);
    }
    playSta();
  }
}

function playSta() {
  G('bfi').style.display = 'block'; G('st').textContent = T('buffering'); G('st').classList.add('bf');
  if (G('ap').src !== sta || !paused) G('ap').src = sta;
  G('ap').play().then(() => {
    const card = Q('.card.active');
    G('st').textContent = T('status_playing', {station: card ? card.querySelector('[data-i18n]').textContent : ''});
    G('st').classList.remove('bf','er'); G('bfi').style.display = 'none';
    startViz(); G('pb').classList.add('playing'); paused = false; updUI();
  }).catch(() => {
    G('st').textContent = T('status_error'); G('st').classList.add('er');
    G('bfi').style.display = 'none'; paused = false;
  });
}

function selectSta(card) {
  QA('.card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  const id = card.dataset.sid;
  if (id?.startsWith('dua_')) {
    speed = 1; G('ap').playbackRate = 1; G('sb').textContent = '1x';
    const s = S.duas.find(d => d.id === id);
    sta = s ? (s[reciter] || '') : card.dataset.url;
  } else sta = card.dataset.url;
  type = id?.startsWith('dua_') ? 'audio' : 'stream';
  paused = false;
  G('st').textContent = T('status_selected', {station: card.querySelector('[data-i18n]').textContent});
  G('st').classList.remove('er','bf');
  localStorage.lastStation = sta;
  G('sk').value = 0; G('ct').textContent = '0:00'; G('dr').textContent = '0:00'; G('edc').style.display = 'none';
  updUI();
  if (playing) playSta();
}

function updUI() {
  const a = type === 'audio';
  G('skc').classList.toggle('on', a); G('psc').classList.toggle('on', a);
  G('pt').textContent = playing ? (a ? T('pause') : T('stop')) : T('play');
}

function initViz() { G('viz').innerHTML = Array(15).fill('<div class="vbar"></div>').join(''); }
function startViz() { G('viz').style.display = 'flex'; animViz(); }
function animViz() {
  if (!playing) return;
  analyser.getByteFrequencyData(dataArr);
  const bars = G('viz').children;
  for (let i = 0; i < bars.length; i++) {
    bars[i].style.height = `${(dataArr[Math.floor(i * (dataArr.length / bars.length))] / 255) * 5 + 1}vh`;
  }
  animId = requestAnimationFrame(animViz);
}
function stopViz() { cancelAnimationFrame(animId); G('viz').style.display = 'none'; [...G('viz').children].forEach(b => b.style.height = '1.5vh'); }

function updSeek() {
  if (!seeking && G('ap').duration && type === 'audio') {
    G('sk').value = (G('ap').currentTime / G('ap').duration) * 100;
    G('ct').textContent = `${Math.floor(G('ap').currentTime / 60)}:${String(Math.floor(G('ap').currentTime % 60)).padStart(2,'0')}`;
    G('dr').textContent = `${Math.floor(G('ap').duration / 60)}:${String(Math.floor(G('ap').duration % 60)).padStart(2,'0')}`;
    if (speed !== 1) {
      const d = G('ap').duration / speed;
      G('ed').innerHTML = T('expected_duration') + '<br>' + Math.floor(d/60) + ':' + String(Math.floor(d%60)).padStart(2,'0');
      G('edc').style.display = 'block';
    }
  }
}
function onSeek() { if (G('ap').duration && type === 'audio') G('ap').currentTime = (G('sk').value / 100) * G('ap').duration; }
function toggleSpeed() {
  const steps = [1, 1.5, 2, 2.5, 3];
  speed = steps[(steps.indexOf(speed) + 1) % steps.length];
  G('ap').playbackRate = speed; G('sb').textContent = speed + 'x';
  localStorage.playbackSpeed = speed;
}

function updVol() { G('ap').volume = G('vs').value; localStorage.volume = G('vs').value; }
function adjVol(d) { let v = Math.max(0, Math.min(1, +G('ap').volume + d)); G('ap').volume = v; G('vs').value = v; localStorage.volume = v; }

const timer = {
  show() { G('lmenu').classList.remove('on'); G('tmenu').classList.toggle('on'); },
  hide() { G('tmenu').classList.remove('on'); },
  adj(v) { let val = (+G('tv').textContent || 0) + v; if (val < 1) val = 1; if (val > 240) val = 240; G('tv').textContent = val; },
  startHold(d) { this.adj(d); holdInt = setInterval(() => this.adj(d), 200); },
  stopHold() { clearInterval(holdInt); },
  set() {
    const mins = +G('tv').textContent;
    this.run(mins); G('tds').textContent = T('timer_set', {minutes: mins}); this.hide();
  },
  cancel() {
    clearInterval(countInt); clearTimeout(sleepTid);
    G('tcd').style.display = 'none'; G('tsm').style.display = 'none';
    G('tds').textContent = T('timer_canceled'); this.hide();
  },
  run(mins) {
    clearTimeout(sleepTid); clearInterval(countInt);
    if (mins > 0) {
      remain = mins * 60; G('tcd').style.display = 'block'; G('tsm').style.display = 'none';
      countInt = setInterval(() => {
        remain--;
        G('tcd').textContent = T('time_remaining', {minutes: Math.floor(remain/60), seconds: String(remain%60).padStart(2,'0')});
        if (remain <= 0) { clearInterval(countInt); G('tcd').style.display = 'none'; G('tsm').style.display = 'block'; setTimeout(() => G('tsm').style.display = 'none', 5000); }
      }, 1000);
      sleepTid = setTimeout(() => {
        if (playing) G('ap').pause();
        G('tcd').style.display = 'none'; G('tsm').style.display = 'block';
        setTimeout(() => G('tsm').style.display = 'none', 5000);
      }, mins * 60000);
    }
  }
};

function showMenu(id) {
  ['tmenu','lmenu'].forEach(m => { if (m !== id) G(m)?.classList.remove('on'); });
  G(id)?.classList.toggle('on');
}

G('pb').addEventListener('click', togglePlay);
G('ap').addEventListener('play', () => { playing = true; G('pi').textContent = '⏸️'; G('pb').classList.add('playing'); });
G('ap').addEventListener('pause', () => { playing = false; G('pi').textContent = '▶️'; G('pb').classList.remove('playing'); G('bfi').style.display = 'none'; G('st').classList.remove('bf'); if (G('ap').error) { G('st').textContent = T('status_error'); G('st').classList.add('er'); } });
G('ap').addEventListener('ended', () => { playing = false; G('pi').textContent = '▶️'; G('pb').classList.remove('playing'); });
G('ap').addEventListener('error', () => { G('st').textContent = T('status_error'); G('st').classList.add('er'); playing = false; });
G('ap').addEventListener('timeupdate', updSeek);
G('ap').addEventListener('loadedmetadata', updSeek);
G('vs').addEventListener('input', updVol);
G('vd').addEventListener('click', () => adjVol(-0.1));
G('vu').addEventListener('click', () => adjVol(0.1));
G('sk').addEventListener('input', onSeek);
['mousedown','touchstart'].forEach(e => G('sk').addEventListener(e, () => seeking = true));
['mouseup','touchend'].forEach(e => G('sk').addEventListener(e, () => seeking = false));
G('sb').addEventListener('click', toggleSpeed);

G('sc').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) selectSta(c); });
Q('.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) { build(t.dataset.cat); QA('.tab').forEach(b => b.classList.toggle('active', b === t)); } });
G('lmenu').addEventListener('click', e => { const b = e.target.closest('.lbtn'); if (b) setLang(b.dataset.lang); if (e.target.classList.contains('cls')) G('lmenu').classList.remove('on'); });

G('lbtn').addEventListener('click', () => showMenu('lmenu'));
G('tbtn').addEventListener('click', () => timer.show());
G('thbtn').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); localStorage.darkMode = document.body.classList.contains('dark-mode'); });
G('dbtn').addEventListener('click', () => window.open('http://mamhaz.blogspot.com/p/radio.html', '_blank'));
G('tsb').addEventListener('click', () => timer.set());
G('tcb').addEventListener('click', () => timer.cancel());
G('ib').addEventListener('click', () => timer.adj(1));
G('db').addEventListener('click', () => timer.adj(-1));
G('ib').addEventListener('mousedown', () => timer.startHold(1));
G('ib').addEventListener('touchstart', () => timer.startHold(1));
G('db').addEventListener('mousedown', () => timer.startHold(-1));
G('db').addEventListener('touchstart', () => timer.startHold(-1));
['mouseup','mouseleave','touchend'].forEach(e => { G('ib').addEventListener(e, timer.stopHold); G('db').addEventListener(e, timer.stopHold); });
QA('.menu .cls').forEach(el => el.addEventListener('click', () => el.parentElement.classList.remove('on')));

document.addEventListener('click', e => {
  if (!e.target.closest('.bn, .menu, #tbtn, #lbtn, .tabs')) {
    G('tmenu').classList.remove('on'); G('lmenu').classList.remove('on');
  }
});

window.addEventListener('online', () => G('oi').style.display = 'none');
window.addEventListener('offline', () => { G('oi').style.display = 'block'; if (playing) { G('st').textContent = T('offline_message'); G('st').classList.add('er'); } });

initViz();
if (localStorage.darkMode === 'true') document.body.classList.add('dark-mode');
G('ap').volume = localStorage.volume || 0.75; G('vs').value = G('ap').volume;
if (localStorage.playbackSpeed) { speed = +localStorage.playbackSpeed; G('ap').playbackRate = speed; G('sb').textContent = speed + 'x'; }
if (localStorage.currentReciter) reciter = localStorage.currentReciter;

setLang(L);
build(localStorage.activeCategory || 'news');
QA('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === (localStorage.activeCategory || 'news')));
G('viz').style.display = 'none';
G('oi').style.display = navigator.onLine ? 'none' : 'block';

const lst = localStorage.lastStation;
if (lst) setTimeout(() => {
  const card = Q(`.card[data-url="${lst}"]`);
  if (card) { sta = lst; type = card.dataset.sid?.startsWith('dua_') ? 'audio' : 'stream'; card.classList.add('active'); updUI(); }
}, 200);

setTimeout(() => QA('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (D[k]?.[L]) el.innerHTML = T(k); }), 100);

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
